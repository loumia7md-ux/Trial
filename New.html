<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Salma & Omar Wedding</title>

<style>

  body {

    margin: 0;

    font-family: 'Georgia', serif;

    background: linear-gradient(to top, #fce4ec, #ffffff);

    text-align: center;

    overflow: hidden;

  }

  .container {

    margin-top: 100px;

    animation: fadeIn 2s ease-in-out;

  }

  h1 {

    font-size: 50px;

    color: #b76e79;

  }

  h2 {

    font-size: 28px;

    color: #444;

  }

  p {

    font-size: 20px;

    color: #666;

  }

  .heart {

    position: absolute;

    color: #ff6b81;

    animation: float 6s infinite;

  }

  @keyframes fadeIn {

    from {opacity: 0;}

    to {opacity: 1;}

  }

  @keyframes float {

    0% {transform: translateY(100vh);}

    100% {transform: translateY(-10vh);}

  }

  button {

    margin-top: 20px;

    padding: 12px 25px;

    border: none;

    background: #b76e79;

    color: white;

    border-radius: 25px;

    font-size: 16px;

    cursor: pointer;

  }

</style>

</head>

<body>

<div class="container">

  <h2>You’re Invited 💌</h2>

  <h1>Salma & Omar</h1>

  <p>Join us to celebrate our special day</p>

  <p>20 June 2026</p>

  <p>7:00 PM</p>

  <button onclick="alert('Location will be shared soon 💍')">

    View Location 📍

  </button>

</div>

<script>

  function createHearts() {

    for (let i = 0; i < 20; i++) {

      let heart = document.createElement("div");

      heart.className = "heart";

      heart.innerHTML = "❤";

      heart.style.left = Math.random() * 100 + "vw";

      heart.style.fontSize = (Math.random() * 20 + 10) + "px";

      heart.style.animationDuration = (Math.random() * 5 + 3) + "s";

      document.body.appendChild(heart);

    }

  }

  createHearts();

</script>

</body>

</html>

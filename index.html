
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Our Anniversary</title>

<style>

body {

    margin: 0;

    min-height: 100vh;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, sans-serif;

    color: #4a3b4f;

    /* 💜 رومانسي موف + بينك */

    background: linear-gradient(135deg, #ffe6f0, #e6d6ff, #fff0f6);

}

.container {

    text-align: center;

    max-width: 600px;

    padding: 25px;

    z-index: 2;

    background: rgba(255,255,255,0.6);

    border-radius: 20px;

    backdrop-filter: blur(8px);

    box-shadow: 0 10px 30px rgba(0,0,0,0.1);

    animation: fadeIn 1.5s ease;

}

@keyframes fadeIn {

    from {opacity:0; transform: translateY(20px);}

    to {opacity:1; transform: translateY(0);}

}

h1 {

    margin: 10px 0;

    color: #7a4fa3;

}

.heart {

    font-size: 45px;

    animation: beat 1s infinite alternate;

    color: #ff4d88;

}

@keyframes beat {

    to { transform: scale(1.2); }

}

.tshirt {

    margin-top: 20px;

    padding: 15px;

    border: 2px dashed #b084cc;

    border-radius: 15px;

    background: rgba(255,255,255,0.7);

}

/* 💋 kisses */

.kiss {

    position: absolute;

    font-size: 24px;

    animation: floatUp linear infinite;

    opacity: 0;

}

@keyframes floatUp {

    0% {

        transform: translateY(100vh) scale(0.8);

        opacity: 0;

    }

    10% { opacity: 1; }

    100% {

        transform: translateY(-10vh) scale(1.3);

        opacity: 0;

    }

}

</style>

</head>

<body>

<div class="container">

    <div class="heart">❤</div>

    <h1>Happy Anniversary!</h1>

    <p>Every year with you feels like a dream 💜</p>

    <div class="tshirt">

        Always & Forever My Love 💕

    </div>

</div>

<script>

// 💋 floating kisses

for (let i = 0; i < 25; i++) {

    let kiss = document.createElement("div");

    kiss.className = "kiss";

    kiss.innerText = "💋";

    kiss.style.left = Math.random() * 100 + "vw";

    kiss.style.animationDuration = (3 + Math.random() * 3) + "s";

    kiss.style.animationDelay = Math.random() * 4 + "s";

    kiss.style.fontSize = (18 + Math.random() * 25) + "px";

    document.body.appendChild(kiss);

}

</script>

</body>

</html>
